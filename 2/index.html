<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পশ্চিমবঙ্গ চাকরি অ্যালার্ট ড্যাশবোর্ড (WB Job Alerts)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                🇮🇳 পশ্চিমবঙ্গ চাকরি অ্যালার্ট পোর্টাল
            </h1>
            <p class="text-sm bg-blue-800 px-3 py-1 rounded-full mt-2 md:mt-0">
                লাইভ আপডেট: ৩০+ গুরুত্বপূর্ণ চাকরি (WB Govt > Central > Private)
            </p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <input type="text" id="searchInput" placeholder="পদ, সংস্থা বা যোগ্যতা দিয়ে খুঁজুন..." 
                class="w-full md:w-1/3 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
            
            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                <button onclick="filterCategory('all')" class="filter-btn px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold whitespace-nowrap">সব চাকরি</button>
                <button onclick="filterCategory('WB Govt')" class="filter-btn px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold whitespace-nowrap">পশ্চিমবঙ্গ সরকার</button>
                <button onclick="filterCategory('Central Govt')" class="filter-btn px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold whitespace-nowrap">কেন্দ্রীয় সরকার</button>
                <button onclick="filterCategory('Private')" class="filter-btn px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold whitespace-nowrap">প্রাইভেট সেক্টর</button>
            </div>
        </div>

        <!-- Job Grid -->
        <div id="jobGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="col-span-full text-center text-slate-500 py-10">ডেটা লোড হচ্ছে...</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white text-center py-6 mt-12">
        <p class="text-sm">© ২০২৬ পশ্চিমবঙ্গ জব অ্যালার্ট পোর্টাল। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <!-- Script -->
    <script>
        let jobsData = [];
        const jobGrid = document.getElementById('jobGrid');
        const searchInput = document.getElementById('searchInput');
        let currentFilter = 'all';

        // Fetch jobs from jobs.json
        async function fetchJobs() {
            try {
                const response = await fetch('jobs.json');
                jobsData = await response.json();
                displayJobs();
            } catch (error) {
                jobGrid.innerHTML = `<p class="col-span-full text-center text-rose-500 py-10">ডেটা লোড করতে সমস্যা হয়েছে!</p>`;
            }
        }

        function displayJobs(filter = 'all', searchQuery = '') {
            jobGrid.innerHTML = '';
            
            const filtered = jobsData.filter(job => {
                const matchesCategory = filter === 'all' || job.type === filter;
                const matchesSearch = job.post.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      job.org.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      job.qualification.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if(filtered.length === 0) {
                jobGrid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">কোনো চাকরি পাওয়া যায়নি।</p>`;
                return;
            }

            filtered.forEach(job => {
                let badgeColor = job.type === 'WB Govt' ? 'bg-emerald-100 text-emerald-800' : job.type === 'Central Govt' ? 'bg-indigo-100 text-indigo-800' : 'bg-amber-100 text-amber-800';
                
                let card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md ${badgeColor}">${job.type}</span>
                            <span class="text-xs font-semibold text-slate-500">কোড: ${job.code}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-1">${job.post}</h3>
                        <p class="text-sm font-medium text-blue-700 mb-3">${job.org}</p>
                        
                        <div class="space-y-1.5 text-sm text-slate-600 mb-4 border-t border-b border-slate-100 py-3">
                            <p><strong>শূন্যপদ:</strong> <span class="text-slate-900 font-semibold">${job.vacancies}</span></p>
                            <p><strong>শিক্ষাগত যোগ্যতা:</strong> ${job.qualification}</p>
                            <p><strong>আবেদনের শেষ তারিখ:</strong> <span class="text-rose-600 font-semibold">${job.lastDate}</span></p>
                        </div>
                    </div>
                    
                    <a href="${job.applyLink}" target="_blank" 
                       class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition text-sm">
                        আবেদন করুন (Apply Now) ➔
                    </a>
                `;
                jobGrid.appendChild(card);
            });
        }

        function filterCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-slate-200', 'text-slate-700');
            });
            event.target.classList.remove('bg-slate-200', 'text-slate-700');
            event.target.classList.add('bg-blue-600', 'text-white');
            
            displayJobs(currentFilter, searchInput.value);
        }

        searchInput.addEventListener('input', (e) => {
            displayJobs(currentFilter, e.target.value);
        });

        // Initial fetch call
        fetchJobs();
    </script>
</body>
</html>

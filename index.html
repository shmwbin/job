<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট টিন - শর্টস জোন</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container" id="app-container">
        <!-- Top Floating Header -->
        <header class="floating-header">
            <div class="brand">🔥 স্মার্ট শর্টস জোন</div>
            <div class="score-badge">XP: <span id="score">০</span></div>
        </header>

        <!-- Shorts & Image Feed Container -->
        <main id="shorts-feed" class="shorts-container">
            <!-- Dynamic shorts will load here -->
        </main>

        <!-- Transparent Touch Swipe Layer (Eta video er upor touch capture korbe) -->
        <div id="touch-layer" class="touch-overlay"></div>

        <!-- Right Side Action Bar -->
        <aside class="action-sidebar">
            <button class="action-btn" onclick="likeShort()">❤️<span id="like-count">১২০</span></button>
            <button class="action-btn" onclick="nextShort()">⚡<span class="btn-text">পরেরটা</span></button>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>

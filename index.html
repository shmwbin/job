<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্মার্ট টিন - শর্টস জোন</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <!-- টপ ফ্লোটিং হেডার -->
        <header class="floating-header">
            <div class="brand">🔥 স্মার্ট শর্টস</div>
            <div class="score-badge">XP: <span id="score">০</span></div>
        </header>

        <!-- ভার্টিকাল শর্টস ফিড কন্টেইনার (যেখানে রিলসের মতো উপর-নিচে স্ক্রোল বা নেক্সট হবে) -->
        <main id="shorts-feed" class="shorts-container">
            <!-- ডাইনামিক শর্টস কার্ড এখানে লোড হবে -->
        </main>

        <!-- রাইট সাইড অ্যাকশন বার (লাইক, নেক্সট, শেয়ার বাটন যেমন রিলসে থাকে) -->
        <aside class="action-sidebar">
            <button class="action-btn" onclick="likeShort()">❤️<span id="like-count">১২০</span></button>
            <button class="action-btn" onclick="nextShort()">⚡<span class="btn-text">পরেরটা</span></button>
            <button class="action-btn" onclick="shareApp()">↗️</button>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeenMind - Smart Zone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <!-- Top Status Bar -->
        <header>
            <div class="level-box">লেভেল: <span id="level">১</span></div>
            <div class="score-box">পয়েন্ট: <span id="score">০</span> XP</div>
        </header>

        <!-- Main Feed / Challenge Area -->
        <main id="feed-container">
            <div class="card" id="card-box">
                <!-- Dynamic Content Loads Here -->
            </div>
        </main>

        <!-- Interactive Question Section (Hidden by default, shown for quizzes) -->
        <section id="quiz-section" class="hidden">
            <h3 id="question-text">প্রশ্ন এখানে আসবে</h3>
            <div id="options-container"></div>
        </section>

        <!-- Bottom Navigation & Controls -->
        <nav class="bottom-nav">
            <button onclick="nextCard()" class="btn-next">পরবর্তী তথ্য 🚀</button>
            <button onclick="startQuiz()" class="btn-quiz">মিনি কুইজ 🧠</button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
